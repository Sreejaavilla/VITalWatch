# RBAC matrix. OWNER: Caleb. Enforcement reads THIS FILE — never hardcode a role in a route.
# actions: read | write | export | admin
# A role absent from a resource means denied (403). Default deny.

roles:
  principal_investigator:
    label: Principal Investigator
    scope: own_studies
  study_coordinator:
    label: Study Coordinator
    scope: own_sites
  monitor:
    label: Clinical Monitor
    scope: assigned_studies
  ethics_committee:
    label: Ethics Committee
    scope: all_studies
  pharmacovigilance:
    label: Pharmacovigilance Officer
    scope: all_studies
  admin:
    label: Administrator
    scope: all
  regulator:
    label: Regulator (read-only)
    scope: all
    mutations_denied: true      # 403 on every POST/PATCH/DELETE, no exceptions

# resource: [roles permitted per action]
permissions:
  studies:      { read: [], write: [] }
  sites:        { read: [], write: [] }
  subjects:     { read: [], write: [] }   # never exposes a name field to any role
  visits:       { read: [], write: [] }
  deviations:   { read: [], write: [] }
  queries:      { read: [], write: [] }
  adverse_events: { read: [], write: [] }
  signals:      { read: [] }
  milestones:   { read: [], write: [] }
  alerts:       { read: [], write: [] }
  audit:        { read: [], export: [] }
  users:        { read: [], admin: [] }
  export:       { export: [] }
  fhir:         { read: [] }
