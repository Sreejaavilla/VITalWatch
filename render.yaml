# Render blueprint. OWNER: Kavin.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Free tier, no card. Instance sleeps after ~15 min idle and cold-starts in ~50s —
# warm it 10 minutes before pitching (Phase 5 checklist).
services:
  - type: web
    name: vitalwatch-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: STUB_MODE
        value: "true"          # flip to false at hour 12, not hour 22
      - key: CORS_ORIGINS
        value: "http://localhost:3000"   # add the Vercel URL once it exists
